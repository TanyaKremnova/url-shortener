services:
  postgres:
    image: postgres:17
    container_name: url_shortener_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./internal/database/migrations:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7
    container_name: url_shortener_cache
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app1:
    build: .
    container_name: url_shortener_app1
    env_file: .env
    environment:
      - APP_PORT=8080
    depends_on:
      - postgres
      - redis

  app2:
    build: .
    container_name: url_shortener_app2
    env_file: .env
    environment:
      - APP_PORT=8080
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: url_shortener_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2


volumes:
  pgdata: